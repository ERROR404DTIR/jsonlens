<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">JSONLens</title><desc id="d">Structured JSON data is explored through a clean tree view.</desc><defs><linearGradient id="bg"><stop stop-color="#182b42"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#62e3c1" stroke-width="3" fill="none"><path d="M170 100V210M170 130H330M170 180H330M330 130V90H500M330 180V225H500"/></g><g fill="#142b43" stroke="#8fa8ff" stroke-width="2"><rect x="90" y="72" width="160" height="56" rx="9"/><rect x="330" y="102" width="170" height="56" rx="9"/><rect x="330" y="170" width="170" height="56" rx="9"/><rect x="590" y="62" width="180" height="56" rx="9"/><rect x="590" y="197" width="180" height="56" rx="9"/></g><g fill="#edf3ff" font-family="monospace" font-size="15"><text x="115" y="106">JSON</text><text x="355" y="137">OBJECT</text><text x="355" y="205">ARRAY</text><text x="615" y="97">QUERY</text><text x="615" y="232">EXPORT</text></g><circle r="6" fill="#a89bff"><animateMotion dur="3.5s" repeatCount="indefinite" path="M170 100V130H330H500"/></circle><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">JSONLENS</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">INSPECT / QUERY / TRANSFORM</text></svg>